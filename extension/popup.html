<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>cctabgaze</title>
<style>
  :root { --bg:#fff; --fg:#222; --mute:#666; --on:#1a73e8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#222; --fg:#eee; --mute:#aaa; } }
  body { width:320px; margin:0; padding:12px; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; }
  h1 { margin:0 0 8px; font-size:15px; }
  #hint { margin:0 0 10px; color:var(--mute); font-size:12px; }
  .row { display:flex; gap:8px; }
  button { flex:1; font:inherit; padding:6px 0; cursor:pointer; }
  #status { margin:10px 0 0; min-height:1.4em; word-break:break-all; }
  #show { width:100%; margin-top:6px; }
  #log { margin:8px 0 0; max-height:240px; overflow:auto; white-space:pre-wrap; word-break:break-all; font:11px ui-monospace, monospace; }
  details { margin-top:10px; font-size:12px; }
  summary { cursor:pointer; color:var(--mute); }
  #nets { width:100%; box-sizing:border-box; margin-top:6px; font:12px ui-monospace, monospace; }
  #netsrow { display:flex; gap:8px; align-items:center; margin-top:6px; }
  #netsrow button { flex:none; padding:4px 12px; }
  #netsmsg { color:var(--mute); }
  button.on { background:var(--on); color:#fff; border:1px solid var(--on); border-radius:4px; }
</style>
</head>
<body>
<h1>cctabgaze</h1>
<p id="hint"></p>
<div class="row"><button id="host">Host</button><button id="viewer">Viewer</button><button id="showlog">紀錄</button></div>
<p id="status"></p>
<button id="show" hidden>顯示畫面</button>
<pre id="log" hidden></pre>
<details>
  <summary>允許的網段</summary>
  <p style="margin:6px 0 0;color:var(--mute)">連線只接受這些網段內的位址，一行一個（例如 100.64.0.0/10）。留空就還原預設。<b>兩台都要各設一次</b>，下次連線生效。</p>
  <textarea id="nets" rows="4" spellcheck="false" autocomplete="off"></textarea>
  <div id="netsrow"><button id="netssave">儲存</button><span id="netsmsg"></span></div>
</details>
<script src="rtc.js"></script>
<script src="popup.js"></script>
</body>
</html>
