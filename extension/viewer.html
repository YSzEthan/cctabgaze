<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cctabgaze</title>
<style>
  :root { --bg:#fafafa; --fg:#222; --mute:#666; --line:#8884; --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --mute:#999; } }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; gap:12px; align-items:center; padding:8px 16px; border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; }
  #title { overflow:hidden; text-overflow:ellipsis; }
  #url, #age, #status { color:var(--mute); overflow:hidden; text-overflow:ellipsis; }
  #age, #status { flex:none; }
  #age { margin-left:auto; }
  #stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  #img { max-width:100%; max-height:100%; object-fit:contain; }
  #msg { color:var(--mute); }
  #log { margin:0; padding:8px 16px; max-height:30vh; overflow:auto; white-space:pre-wrap; word-break:break-all; font:12px ui-monospace, monospace; border-top:1px solid var(--line); }
  button { font:inherit; padding:4px 10px; }
</style>
</head>
<body>
<header><strong id="title">cctabgaze</strong><span id="url"></span><span id="age"></span><span id="status"></span><button id="showlog">診斷紀錄</button></header>
<main id="stage"><img id="img" alt="" hidden><div id="msg">等待畫面…</div></main>
<pre id="log" hidden></pre>
<script src="viewer.js"></script>
</body>
</html>
