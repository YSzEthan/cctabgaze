<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cctabgaze</title>
<style>
  :root { --bg:#fafafa; --fg:#222; --mute:#666; --line:#8884; --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --mute:#999; } }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; gap:8px; align-items:center; padding:6px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  #ctl { display:flex; gap:6px; flex:1; min-width:0; }
  #ctl[inert], #tabs[inert] { opacity:.5; }
  #addr { flex:1; min-width:0; font:inherit; padding:4px 8px; }
  #age, #status { color:var(--mute); flex:none; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; } /* 固定寬度：文字長短變動不會把網址框擠來擠去 */
  #age { width:19em; text-align:right; }
  #status { width:9em; }
  #tabs { display:flex; gap:6px; align-items:center; padding:4px 12px; border-bottom:1px solid var(--line); }
  #tablist { display:flex; gap:4px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:thin; }
  .tab { display:flex; gap:6px; align-items:center; flex:none; max-width:200px; padding:3px 8px; border:1px solid var(--line); border-radius:6px; cursor:default; user-select:none; }
  .tab.on { background:#1a73e822; border-color:#1a73e8; }
  .tab .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tab .x { color:var(--mute); padding:0 2px; }
  .tab .x:hover { color:var(--bad); }
  #stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  #img { max-width:100%; max-height:100%; object-fit:contain; cursor:default; user-select:none; -webkit-user-drag:none; }
  #kb { position:fixed; left:0; top:0; width:1px; height:1px; opacity:0; border:0; padding:0; resize:none; }
  #msg { color:var(--mute); }
  #log { margin:0; padding:8px 16px; max-height:30vh; overflow:auto; white-space:pre-wrap; word-break:break-all; font:12px ui-monospace, monospace; border-top:1px solid var(--line); }
  button { font:inherit; padding:4px 10px; }
</style>
</head>
<body>
<header>
  <div id="ctl"><button id="back" title="上一頁">‹</button><button id="fwd" title="下一頁">›</button><button id="reload" title="重新整理">⟳</button><input id="addr" spellcheck="false" autocomplete="off" placeholder="輸入網址後按 Enter"></div>
  <span id="age"></span><span id="status"></span><button id="showlog">診斷紀錄</button>
</header>
<nav id="tabs"><div id="tablist"></div><button id="newtab" title="新增分頁">＋</button><button id="auto" title="回到跟隨 AI" hidden>自動</button></nav>
<main id="stage"><img id="img" alt="" hidden><div id="msg">等待畫面…</div></main>
<pre id="log" hidden></pre>
<textarea id="kb" aria-label="keyboard input" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
<script src="viewer.js"></script>
</body>
</html>
