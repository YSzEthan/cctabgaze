<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>proto-B</title>
<style>
  :root { --bg:#fafafa; --fg:#222; --mute:#666; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --mute:#999; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  input, select, button { font:inherit; padding:4px 8px; }
  p { color:var(--mute); margin:4px 0 12px; }
  pre { white-space:pre-wrap; word-break:break-all; font:12px ui-monospace, monospace; border:1px solid #8884; padding:8px; min-height:200px; }
</style>
</head>
<body>
<p>順序：先在 <b>viewer</b> 那台按「開始」，再到 <b>host</b> 那台按「開始」。兩邊都要登入同一個 Google 帳號並開啟同步。</p>
<div class="row">
  角色 <select id="role"><option>host</option><option>viewer</option><option>recv</option></select>
  這台的 Tailscale IP（只有 candidate 變成 .local 時才需要填）<input id="ip" size="16" placeholder="100.x.x.x">
  <button id="start">開始</button> <button id="reset">清除 sync 資料</button>
  <button id="bg">啟用背景接收</button> <button id="showlog">顯示背景紀錄</button> <button id="clearlog">清除背景紀錄</button>
</div>
<pre id="log"></pre>
<script src="panel.js"></script>
</body>
</html>
