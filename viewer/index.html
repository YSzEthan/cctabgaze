<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cctabgaze</title>
<style>
  :root { --bg:#111; --fg:#eee; --mute:#999; --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
  @media (prefers-color-scheme: light) { :root { --bg:#fafafa; --fg:#222; --mute:#666; } }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; gap:12px; align-items:center; padding:8px 16px; border-bottom:1px solid #8884; white-space:nowrap; overflow:hidden; }
  #dot { width:10px; height:10px; border-radius:50%; background:var(--bad); flex:none; }
  #title { font-weight:600; overflow:hidden; text-overflow:ellipsis; }
  #url, #status { color:var(--mute); overflow:hidden; text-overflow:ellipsis; }
  #status { margin-left:auto; flex:none; }
  main { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  img { max-width:100%; max-height:100%; object-fit:contain; }
  #msg { color:var(--mute); }
</style>
</head>
<body>
<header><span id="dot"></span><span id="title">等待畫面…</span><span id="url"></span><span id="status"></span></header>
<main><img id="img" alt="" hidden><div id="msg">尚未收到畫面</div></main>
<script>
const $ = (id) => document.getElementById(id);
let lastSignal = 0, lastChange = 0, mode = 'wait', ws;

function connect() {
  ws = new WebSocket('ws://' + location.host + '/view');
  ws.onopen = () => { $('dot').style.background = 'var(--warn)'; };
  ws.onclose = () => { $('dot').style.background = 'var(--bad)'; setTimeout(connect, 1000); };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    lastSignal = Date.now();
    $('dot').style.background = 'var(--ok)';
    if (m.type === 'frame') {
      mode = 'frame'; lastChange = Date.now();
      $('img').src = 'data:image/jpeg;base64,' + m.data; $('img').hidden = false; $('msg').hidden = true;
      $('title').textContent = m.title; $('url').textContent = m.url;
    } else if (m.type === 'same') { if (mode === 'frame') mode = 'same'; }
    else if (m.type === 'error') { mode = 'error'; $('msg').hidden = false; $('msg').textContent = m.message; $('img').hidden = true; $('title').textContent = '無法顯示'; $('url').textContent = ''; }
  };
}

setInterval(() => {
  if (!lastSignal) return;
  const quiet = Math.round((Date.now() - lastSignal) / 1000);
  if (quiet >= 3) { $('status').textContent = '已 ' + quiet + ' 秒沒有訊號'; return; }
  let text = '即時';
  if (mode === 'same') text = '畫面未變動（' + Math.round((Date.now() - lastChange) / 1000) + ' 秒）';
  else if (mode === 'error') text = '無法顯示';
  $('status').textContent = text;
}, 500);
connect();
</script>
</body>
</html>
